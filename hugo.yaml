baseURL: "https://patrickstar77.github.io/"
locale: "zh-CN"
defaultContentLanguage: "zh"
title: "PatrickStar 的博客"
theme: ["PaperMod"]

pagination:
  pagerSize: 8

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
  goldmark:
    extensions:
      extras:
        mark:
          enable: true
      passthrough:
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
            - ["$", "$"]
        enable: true
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

taxonomies:
  category: categories
  tag: tags

params:
  env: production
  math: true
  comments: true
  title: "PatrickStar 的博客"
  description: "记录 AI、强化学习、论文阅读与工程实践"
  keywords: ["AI", "强化学习", "深度学习", "技术博客"]
  author: "PatrickStar"
  DateFormat: "2006-01-02"

  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  UseHugoToc: true
  showtoc: true
  tocopen: false

  assets:
    favicon: "/favicon.png"
    favicon16x16: "/favicon.png"
    favicon32x32: "/favicon.png"

  homeInfoParams:
    Title: "欢迎访问我的博客"
    Content: "你好，我是 PatrickStar，目前专注于离线强化学习（Offline Reinforcement Learning）的学习与研究，关注如何从固定数据集中学习可靠、稳健且具有泛化能力的决策策略。这个博客用于系统记录我在 AI、强化学习、深度学习、论文阅读、实验复现与工程实践中的思考与积累，也会分享环境配置、问题排查和研究过程中总结的经验。希望这些内容既能沉淀自己的学习路径，也能为有相似兴趣的读者提供参考。欢迎交流与讨论！"

  socialIcons:
    - name: github
      title: "GitHub"
      url: "https://github.com/patrickstar77"
    - name: rss
      title: "RSS"
      url: "index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 1
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: archives
      name: "归档"
      url: "/archives/"
      weight: 10
    - identifier: categories
      name: "分类"
      url: "/categories/"
      weight: 15
    - identifier: search
      name: "搜索"
      url: "/search/"
      weight: 20
    - identifier: tags
      name: "标签"
      url: "/tags/"
      weight: 30
