<script>
  (() => {
    const article = document.querySelector('.post-content');
    if (!article) {
      return;
    }

    const images = article.querySelectorAll('img');
    if (!images.length) {
      return;
    }

    const lightbox = document.createElement('div');
    lightbox.className = 'image-lightbox';
    lightbox.hidden = true;
    lightbox.setAttribute('role', 'dialog');
    lightbox.setAttribute('aria-modal', 'true');
    lightbox.setAttribute('aria-label', '图片预览');
    lightbox.innerHTML = `
      <button class="image-lightbox__close" type="button" aria-label="关闭图片预览">&times;</button>
      <figure class="image-lightbox__figure">
        <img class="image-lightbox__image" alt="">
        <figcaption class="image-lightbox__caption"></figcaption>
      </figure>
    `;
    document.body.appendChild(lightbox);

    const preview = lightbox.querySelector('.image-lightbox__image');
    const caption = lightbox.querySelector('.image-lightbox__caption');
    const closeButton = lightbox.querySelector('.image-lightbox__close');
    let previouslyFocused = null;

    const closeLightbox = () => {
      lightbox.hidden = true;
      preview.removeAttribute('src');
      caption.textContent = '';
      document.body.classList.remove('lightbox-open');
      previouslyFocused?.focus();
    };

    const openLightbox = (image) => {
      previouslyFocused = image;
      preview.src = image.currentSrc || image.src;
      preview.alt = image.alt || '文章图片';

      const figureCaption = image.closest('figure')?.querySelector('figcaption');
      caption.textContent = figureCaption?.textContent?.trim() || image.alt || '';

      lightbox.hidden = false;
      document.body.classList.add('lightbox-open');
      closeButton.focus();
    };

    images.forEach((image) => {
      image.classList.add('zoomable-image');
      image.tabIndex = 0;
      image.setAttribute('role', 'button');
      image.setAttribute('aria-label', image.alt ? `点击放大：${image.alt}` : '点击放大图片');

      image.addEventListener('click', () => openLightbox(image));
      image.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLightbox(image);
        }
      });
    });

    closeButton.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !lightbox.hidden) {
        closeLightbox();
      }
    });
  })();
</script>
