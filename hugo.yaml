baseURL: "https://patrickstar77.github.io/"
locale: "zh-CN"
defaultContentLanguage: "zh"
title: "PatrickStar 的博客"
theme: ["PaperMod"]

pagination:
  pagerSize: 8

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
        enable: true
    renderer:
      unsafe: false
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

taxonomies:
  category: categories
  tag: tags

params:
  env: production
  math: true
  comments: true
  title: "PatrickStar 的博客"
  description: "记录 AI、强化学习、论文阅读与工程实践"
  keywords: ["AI", "强化学习", "深度学习", "技术博客"]
  author: "PatrickStar"
  DateFormat: "2006-01-02"

  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  UseHugoToc: true
  showtoc: true
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon.ico"
    favicon32x32: "/favicon.ico"

  homeInfoParams:
    Title: "欢迎访问我的博客"
    Content: "这里记录我对 AI、强化学习、论文与工程实践的学习和思考。"

  socialIcons:
    - name: github
      title: "GitHub"
      url: "https://github.com/patrickstar77"
    - name: rss
      title: "RSS"
      url: "index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 1
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: archives
      name: "归档"
      url: "/archives/"
      weight: 10
    - identifier: search
      name: "搜索"
      url: "/search/"
      weight: 20
    - identifier: tags
      name: "标签"
      url: "/tags/"
      weight: 30
    - identifier: github
      name: "GitHub"
      url: "https://github.com/patrickstar77"
      weight: 40
