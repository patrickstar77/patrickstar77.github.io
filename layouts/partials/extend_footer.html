<script>
  (() => {
    const article = document.querySelector('.post-content');
    if (!article) {
      return;
    }

    const images = article.querySelectorAll('img');
    if (!images.length) {
      return;
    }

    const lightbox = document.createElement('div');
    lightbox.className = 'image-lightbox';
    lightbox.hidden = true;
    lightbox.setAttribute('role', 'dialog');
    lightbox.setAttribute('aria-modal', 'true');
    lightbox.setAttribute('aria-label', '图片预览');
    lightbox.innerHTML = `
      <button class="image-lightbox__close" type="button" aria-label="关闭图片预览">&times;</button>
      <figure class="image-lightbox__figure">
        <img class="image-lightbox__image" alt="">
        <figcaption class="image-lightbox__caption"></figcaption>
      </figure>
    `;
    document.body.appendChild(lightbox);

    const preview = lightbox.querySelector('.image-lightbox__image');
    const caption = lightbox.querySelector('.image-lightbox__caption');
    const closeButton = lightbox.querySelector('.image-lightbox__close');
    let previouslyFocused = null;

    const closeLightbox = () => {
      lightbox.hidden = true;
      preview.removeAttribute('src');
      caption.textContent = '';
      document.body.classList.remove('lightbox-open');
      previouslyFocused?.focus();
    };

    const openLightbox = (image) => {
      previouslyFocused = image;
      preview.src = image.currentSrc || image.src;
      preview.alt = image.alt || '文章图片';

      const figureCaption = image.closest('figure')?.querySelector('figcaption');
      caption.textContent = figureCaption?.textContent?.trim() || image.alt || '';

      lightbox.hidden = false;
      document.body.classList.add('lightbox-open');
      closeButton.focus();
    };

    images.forEach((image) => {
      image.classList.add('zoomable-image');
      image.tabIndex = 0;
      image.setAttribute('role', 'button');
      image.setAttribute('aria-label', image.alt ? `点击放大：${image.alt}` : '点击放大图片');

      image.addEventListener('click', () => openLightbox(image));
      image.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLightbox(image);
        }
      });
    });

    closeButton.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !lightbox.hidden) {
        closeLightbox();
      }
    });
  })();
</script>

<script>
  (() => {
    const query = new URLSearchParams(window.location.search).get('q')?.trim();
    if (!query) {
      return;
    }

    const contentRoot = document.querySelector('.post-content');
    const titleRoot = document.querySelector('.post-title');
    if (!contentRoot && !titleRoot) {
      return;
    }

    const terms = [
      query,
      ...query.split(/\s+/).filter((term) => term.length >= 2)
    ];
    const excludedSelector = [
      'script',
      'style',
      'textarea',
      '.MathJax',
      '.katex',
      '.image-lightbox',
      '.comments-area'
    ].join(',');

    const highlightTerm = (root, term) => {
      if (!root || !term) {
        return [];
      }

      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let node;
      while ((node = walker.nextNode())) {
        if (
          node.nodeValue.trim() &&
          !node.parentElement.closest(excludedSelector)
        ) {
          nodes.push(node);
        }
      }

      const hits = [];
      const lowerTerm = term.toLocaleLowerCase();
      for (const textNode of nodes) {
        if (hits.length >= 100) {
          break;
        }

        const text = textNode.nodeValue;
        const lowerText = text.toLocaleLowerCase();
        let index = lowerText.indexOf(lowerTerm);
        if (index < 0) {
          continue;
        }

        const fragment = document.createDocumentFragment();
        let cursor = 0;
        while (index >= 0 && hits.length < 100) {
          fragment.append(text.slice(cursor, index));

          const mark = document.createElement('mark');
          mark.className = 'search-hit';
          mark.textContent = text.slice(index, index + term.length);
          fragment.appendChild(mark);
          hits.push(mark);

          cursor = index + term.length;
          index = lowerText.indexOf(lowerTerm, cursor);
        }
        fragment.append(text.slice(cursor));
        textNode.replaceWith(fragment);
      }

      return hits;
    };

    let hits = [];
    for (const term of terms) {
      hits = highlightTerm(contentRoot, term);
      if (hits.length) {
        break;
      }

      hits = highlightTerm(titleRoot, term);
      if (hits.length) {
        break;
      }
    }

    if (!hits.length) {
      return;
    }

    const navigator = document.createElement('aside');
    navigator.className = 'search-hit-nav';
    navigator.setAttribute('aria-label', '文章内搜索结果导航');
    navigator.innerHTML = `
      <span class="search-hit-nav__query"></span>
      <button class="search-hit-nav__button search-hit-nav__previous" type="button" aria-label="上一个关键词" title="上一个关键词">↑</button>
      <output class="search-hit-nav__counter" aria-live="polite"></output>
      <button class="search-hit-nav__button search-hit-nav__next" type="button" aria-label="下一个关键词" title="下一个关键词">↓</button>
      <button class="search-hit-nav__button search-hit-nav__close" type="button" aria-label="关闭搜索结果导航并清除高亮" title="关闭并清除高亮">&times;</button>
    `;
    document.body.appendChild(navigator);

    const queryLabel = navigator.querySelector('.search-hit-nav__query');
    const previousButton = navigator.querySelector('.search-hit-nav__previous');
    const nextButton = navigator.querySelector('.search-hit-nav__next');
    const closeButton = navigator.querySelector('.search-hit-nav__close');
    const counter = navigator.querySelector('.search-hit-nav__counter');
    const reducedMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;
    let currentIndex = -1;

    queryLabel.textContent = query;
    queryLabel.title = `当前关键词：${query}`;
    previousButton.disabled = hits.length < 2;
    nextButton.disabled = hits.length < 2;

    const activateHit = (index, initial = false) => {
      if (currentIndex >= 0) {
        hits[currentIndex].classList.remove('search-hit--current');
        hits[currentIndex].removeAttribute('tabindex');
      }

      currentIndex = (index + hits.length) % hits.length;
      const currentHit = hits[currentIndex];
      currentHit.classList.add('search-hit--current');
      currentHit.tabIndex = -1;

      counter.textContent = `${currentIndex + 1} / ${hits.length}`;
      counter.setAttribute(
        'aria-label',
        `第 ${currentIndex + 1} 个，共 ${hits.length} 个匹配`
      );

      const scrollToHit = () => {
        currentHit.scrollIntoView({
          behavior: reducedMotion ? 'auto' : 'smooth',
          block: 'center'
        });
        currentHit.focus({ preventScroll: true });
      };

      if (initial) {
        window.requestAnimationFrame(() => {
          window.setTimeout(scrollToHit, 120);
        });
      } else {
        scrollToHit();
      }
    };

    const closeNavigator = () => {
      const parents = new Set();
      hits.forEach((hit) => {
        parents.add(hit.parentNode);
        hit.replaceWith(document.createTextNode(hit.textContent));
      });
      parents.forEach((parent) => parent?.normalize());

      const url = new URL(window.location.href);
      url.searchParams.delete('q');
      window.history.replaceState(
        window.history.state,
        '',
        `${url.pathname}${url.search}${url.hash}`
      );

      navigator.remove();
      contentRoot?.setAttribute('tabindex', '-1');
      contentRoot?.focus({ preventScroll: true });
    };

    previousButton.addEventListener('click', () => {
      activateHit(currentIndex - 1);
    });
    nextButton.addEventListener('click', () => {
      activateHit(currentIndex + 1);
    });
    closeButton.addEventListener('click', closeNavigator);

    activateHit(0, true);
  })();
</script>

<script>
  (() => {
    const sourceToc = document.querySelector('#TableOfContents');
    const article = document.querySelector('.post-content');
    if (!sourceToc || !article) {
      return;
    }

    const sourceLinks = [...sourceToc.querySelectorAll('a[href^="#"]')];
    if (!sourceLinks.length) {
      return;
    }

    const cloneToc = (id) => {
      const nav = sourceToc.cloneNode(true);
      nav.id = id;
      return nav;
    };

    const desktopToc = document.createElement('aside');
    desktopToc.className = 'floating-toc';
    desktopToc.setAttribute('aria-label', '文章目录');
    desktopToc.innerHTML = '<div class="floating-toc__title">本页目录</div>';
    desktopToc.appendChild(cloneToc('FloatingTableOfContents'));
    document.body.appendChild(desktopToc);

    const toggleButton = document.createElement('button');
    toggleButton.className = 'toc-fab';
    toggleButton.type = 'button';
    toggleButton.setAttribute('aria-label', '打开文章目录');
    toggleButton.setAttribute('aria-expanded', 'false');
    toggleButton.setAttribute('aria-controls', 'TocDrawer');
    toggleButton.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M8 6h13M8 12h13M8 18h13"></path>
        <path d="M3 6h.01M3 12h.01M3 18h.01"></path>
      </svg>
      <span>目录</span>
    `;
    document.body.appendChild(toggleButton);

    const drawer = document.createElement('div');
    drawer.id = 'TocDrawer';
    drawer.className = 'toc-drawer';
    drawer.hidden = true;
    drawer.setAttribute('role', 'dialog');
    drawer.setAttribute('aria-modal', 'true');
    drawer.setAttribute('aria-labelledby', 'TocDrawerTitle');
    drawer.innerHTML = `
      <section class="toc-drawer__panel">
        <header class="toc-drawer__header">
          <h2 id="TocDrawerTitle" class="toc-drawer__title">本页目录</h2>
          <button class="toc-drawer__close" type="button" aria-label="关闭文章目录">&times;</button>
        </header>
        <div class="toc-drawer__body"></div>
      </section>
    `;
    drawer.querySelector('.toc-drawer__body')
      .appendChild(cloneToc('DrawerTableOfContents'));
    document.body.appendChild(drawer);

    const closeButton = drawer.querySelector('.toc-drawer__close');
    const drawerPanel = drawer.querySelector('.toc-drawer__panel');
    const allTocLinks = [
      ...desktopToc.querySelectorAll('a[href^="#"]'),
      ...drawer.querySelectorAll('a[href^="#"]')
    ];

    const closeDrawer = () => {
      drawer.hidden = true;
      toggleButton.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('toc-drawer-open');
      toggleButton.focus();
    };

    const openDrawer = () => {
      drawer.hidden = false;
      toggleButton.setAttribute('aria-expanded', 'true');
      document.body.classList.add('toc-drawer-open');
      closeButton.focus();
    };

    toggleButton.addEventListener('click', openDrawer);
    closeButton.addEventListener('click', closeDrawer);
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1280 && !drawer.hidden) {
        drawer.hidden = true;
        toggleButton.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('toc-drawer-open');
      }
    });
    drawer.addEventListener('click', (event) => {
      if (event.target === drawer) {
        closeDrawer();
      }
    });

    drawer.querySelectorAll('a[href^="#"]').forEach((link) => {
      link.addEventListener('click', closeDrawer);
    });

    drawer.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeDrawer();
        return;
      }

      if (event.key !== 'Tab') {
        return;
      }

      const focusable = [
        ...drawerPanel.querySelectorAll('button, a[href]')
      ].filter((element) => !element.hasAttribute('disabled'));
      if (!focusable.length) {
        return;
      }

      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });

    const headings = sourceLinks
      .map((link) => {
        const id = decodeURIComponent(link.getAttribute('href').slice(1));
        return document.getElementById(id);
      })
      .filter(Boolean);

    const setActiveHeading = (heading) => {
      if (!heading) {
        return;
      }

      const target = `#${heading.id}`;
      allTocLinks.forEach((link) => {
        const active = decodeURIComponent(link.getAttribute('href')) === target;
        link.classList.toggle('is-active', active);
        if (active) {
          link.setAttribute('aria-current', 'location');
        } else {
          link.removeAttribute('aria-current');
        }
      });

      desktopToc.querySelectorAll('li.is-current-path').forEach((item) => {
        item.classList.remove('is-current-path');
      });

      const activeDesktopLink = [...desktopToc.querySelectorAll('a[href^="#"]')]
        .find((link) => decodeURIComponent(link.getAttribute('href')) === target);
      let listItem = activeDesktopLink?.closest('li');
      while (listItem && desktopToc.contains(listItem)) {
        listItem.classList.add('is-current-path');
        listItem = listItem.parentElement?.closest('li');
      }

      if (window.matchMedia('(min-width: 1280px)').matches) {
        activeDesktopLink?.scrollIntoView({ block: 'nearest' });
      } else if (!drawer.hidden) {
        const activeDrawerLink = [...drawer.querySelectorAll('a[href^="#"]')]
          .find((link) => decodeURIComponent(link.getAttribute('href')) === target);
        activeDrawerLink?.scrollIntoView({ block: 'nearest' });
      }
    };

    const initialHeading = [...headings]
      .reverse()
      .find((heading) => heading.getBoundingClientRect().top <= 120) || headings[0];
    setActiveHeading(initialHeading);

    const visibleHeadings = new Map();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          visibleHeadings.set(entry.target, entry.boundingClientRect.top);
        } else {
          visibleHeadings.delete(entry.target);
        }
      });

      const current = [...visibleHeadings.entries()]
        .sort((left, right) => left[1] - right[1])[0]?.[0];
      if (current) {
        setActiveHeading(current);
      }
    }, {
      rootMargin: '-80px 0px -70% 0px',
      threshold: [0, 1]
    });

    headings.forEach((heading) => observer.observe(heading));
  })();
</script>

<script>
  (() => {
    const meta = document.querySelector('.post-single .post-meta');
    if (!meta || meta.querySelector('.post-views')) {
      return;
    }

    const views = document.createElement('span');
    views.className = 'post-views';
    views.title = '本页阅读量由 Vercount 统计';
    views.innerHTML = '&nbsp;·&nbsp;<span id="vercount_value_page_pv" aria-live="polite">加载中…</span> 次阅读';
    meta.appendChild(views);

    const value = views.querySelector('#vercount_value_page_pv');
    const markUnavailable = () => {
      views.innerHTML = '&nbsp;·&nbsp;阅读量暂不可用';
      views.classList.add('post-views--unavailable');
    };
    const observer = new MutationObserver(() => {
      const content = value.textContent.trim();
      if (content !== '加载中…' && !/^\d[\d,]*$/.test(content)) {
        observer.disconnect();
        markUnavailable();
      }
    });
    observer.observe(value, {
      childList: true,
      characterData: true,
      subtree: true
    });

    window.setTimeout(() => {
      if (value.isConnected && value.textContent.trim() === '加载中…') {
        observer.disconnect();
        markUnavailable();
      }
    }, 10000);
  })();
</script>
